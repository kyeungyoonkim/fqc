timezone: "Asia/Seoul"
output_dir: "output"

telegram:
  enabled: false
  bot_token: "REPLACE_ME"
  # Invite link is not chat_id. Use negative group id, e.g. -1001234567890
  chat_id: "REPLACE_ME"
  message_template: |
    Daily FQC ({{start_date}} ~ {{end_date}})
    - CTV: R1,R2,R3
    - DLT: E1~E7
    - JC: J03

rolling_window_days: 7

browser:
  # Set true once selectors are confirmed. Keep false to watch it work / approve DUO.
  headless: false
  timeout_ms: 60000

dashboard:
  # 2 images split (same pattern as your current screenshots)
  first_image_lines:
    - CTV:R1
    - CTV:R2
    - CTV:R3
    - DLT:E6
    - DLT:E7
  second_image_lines:
    - DLT:E1
    - DLT:E2
    - DLT:E3
    - DLT:E4
    - DLT:E5
    - JC:J03

targets:
  # optional: line-specific "last year avg." baseline
  CTV:R1: 0.70
  CTV:R2: 0.70
  CTV:R3: 0.70
  DLT:E1: 0.90
  DLT:E2: 0.90
  DLT:E3: 0.90
  DLT:E4: 0.90
  DLT:E5: 1.00
  DLT:E6: 1.20
  DLT:E7: 1.20
  JC:J03: 0.80

mes:
  # false: use MES export_file data (recommended)
  # true: generate sample dummy values
  dry_run: false

  ctv:
    enabled: true
    # If you manually click MES "Excel" and save the file, set this path.
    # When set, parser reads this file first and ignores dry-run for CTV.
    # If each line has separate file, use placeholder:
    # "C:/path/CTV_{line}.xlsx" -> CTV_R1.xlsx, CTV_R2.xlsx, CTV_R3.xlsx
    export_file: ""
    # CTV numbers should be taken only from Grade == TOTAL rows.
    require_grade_total: true
    base_url: "http://10.204.41.132"
    login_url: "http://10.204.41.132/iam/login"
    # URL of the Daily FQC Result (R) page, if it can be opened directly.
    daily_fqc_url: ""
    username: "REPLACE_ME"
    password: "REPLACE_ME"
    lines: ["R1", "R2", "R3"]
    # Date text format typed into the Work Date fields.
    date_format: "%Y-%m-%d"
    login:
      # true: log in by hand in the opened browser (handles DUO), then press Enter.
      manual: true
      duo_required: false
    # You can change selectors after inspecting real page DOM.
    selectors:
      username_input: 'input[name="username"]'
      password_input: 'input[name="password"]'
      login_button: 'button[type="submit"]'
      start_date_input: 'input[placeholder*="From"], input[name*="from"]'
      end_date_input: 'input[placeholder*="To"], input[name*="to"]'
      line_input: 'input[name*="line"], input[placeholder*="Line"]'
      search_button: 'button:has-text("Search"), button:has-text("조회")'
      export_button: 'button:has-text("Excel"), button:has-text("엑셀")'
      table_rows: 'table tbody tr'

  dlt:
    enabled: true
    export_file: ""
    require_grade_total: false
    vpn:
      type: "forticlient"
      profile: "Qcells"
      duo_required: true
    base_url: "http://10.60.110.42"
    login_url: "http://10.60.110.42/emiplus/login"
    username: "REPLACE_ME"
    password: "REPLACE_ME"
    lines: ["E1", "E2", "E3", "E4", "E5", "E6", "E7"]
    selectors:
      username_input: 'input[name="username"]'
      password_input: 'input[name="password"]'
      login_button: 'button[type="submit"]'
      start_date_input: 'input[placeholder*="From"], input[name*="from"]'
      end_date_input: 'input[placeholder*="To"], input[name*="to"]'
      line_input: 'input[name*="line"], input[placeholder*="Line"]'
      search_button: 'button:has-text("Search"), button:has-text("조회")'
      export_button: 'button:has-text("Excel"), button:has-text("엑셀")'
      table_rows: 'table tbody tr'

  jc:
    enabled: true
    export_file: ""
    require_grade_total: false
    vpn:
      type: "anyconnect"
      duo_required: true
    lines: ["J03"]
    # Desktop app automation is environment-specific.
    # For now use CSV fallback or later pywinauto flow.
    data_source_csv: ""
